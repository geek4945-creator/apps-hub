plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing: point -PkeystoreProps=/path/keystore.properties (or env KEYSTORE_PROPS) at a file with
// storeFile, storePassword, keyAlias, keyPassword. Without it the release APK is produced unsigned.
def ksPropsFile = new File(project.findProperty('keystoreProps') ?: System.getenv('KEYSTORE_PROPS') ?: '/workspace/apps-hub-keystore/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.geek4945.appshub'
    compileSdk 34

    defaultConfig {
        applicationId 'com.geek4945.appshub'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '1.0.3'
        // The app refreshes its list from this file (rebuilt nightly); the copy in assets/ is the offline fallback.
        buildConfigField 'String', 'APPS_URL', '"https://raw.githubusercontent.com/geek4945-creator/apps-hub/main/apps.json"'
        // Newest release of this app (checked at most once a day, and on Refresh).
        buildConfigField 'String', 'RELEASE_API_URL', '"https://api.github.com/repos/geek4945-creator/apps-hub/releases/latest"'
        buildConfigField 'String', 'REPO_URL', '"https://github.com/geek4945-creator/apps-hub"'
        buildConfigField 'String', 'WEB_URL', '"https://geek4945-creator.github.io/apps-hub/"'
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPropsFile.exists()) signingConfig signingConfigs.release
        }
    }
    splits { abi { enable false }; density { enable false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    lint { abortOnError false; checkReleaseBuilds false }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.00')
    implementation composeBom
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
